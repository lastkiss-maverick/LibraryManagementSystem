name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Compile Java files
        run: |
          javac src/*.java
          javac -cp src test/*.java

      - name: Run tests
        run: |
          cd test
          java -ea -cp .:../src BookTest

      - name: Run main application
        run: |
          cd src
          java Main